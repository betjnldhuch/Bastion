; ================================================================
;  Настройки ботов Bastion Online (ВКонтакте и Telegram)
;  Строки, начинающиеся с ; — комментарии.
;  После изменения перезапусти ботов (закрой окно и снова start.bat).
;  Токены никому не показывай и не выкладывай на GitHub.
; ================================================================

[vk]
; on — включить бота ВК, off — выключить
enabled = off
; Ключ доступа сообщества: Управление -> Работа с API -> Ключи доступа -> Создать ключ
; (галочки: «Управление сообществом», «Сообщения сообщества»)
token =
; Числовой ID сообщества (без минуса). Видно там же, в «Работа с API -> Long Poll API»
group_id =

[tg]
; on — включить бота Telegram, off — выключить
enabled = off
; Токен от @BotFather (вида 123456789:AA...)
token =

[bot]
; С какого уровня игровой админки можно делать рассылку /news из бота
news_level = 5
; Ссылка на форум (показывается в /help). Пусто — не показывать
forum_url =
; Как часто проверять новые уведомления из игры, секунд
outbox_seconds = 3

; ----------------------------------------------------------------
;  Игровые сервера — как в forum.ini. Бот читает и пишет rp.db:
;  только свои таблицы (social_*, bot_*). Пароли меняет сам мод.
; ----------------------------------------------------------------

; db должен указывать на реальную локально доступную базу хостинга; адрес игры не заменяет путь к SQLite.
[server:peace]
name = Bastion Peace
db = C:\openmp\Server\scriptfiles\rp.db
address = 80.47.6.18
port = 25174

