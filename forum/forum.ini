; ================================================================
;  Настройки форума Bastion Online
;  Строки, начинающиеся с ; — комментарии.
;  После изменения перезапусти форум (закрой окно и снова start.bat).
; ================================================================

[forum]
title = Bastion Online
subtitle = Форум RolePlay-проекта GTA San Andreas Multiplayer

; На каком адресе и порту открыть форум.
; 0.0.0.0 — форум виден всем (в локальной сети, Radmin VPN, из интернета при пробросе порта).
; 127.0.0.1 — только на этом компьютере.
host = 0.0.0.0
port = 8080

; Ссылка на форум для людей (используется в news.txt и подсказках).
public_url = http://127.0.0.1:8080

; Ник(и) владельцев форума через запятую. Получают права главного администратора
; независимо от уровня админки в игре.
owners =

; С какого уровня игровой админки человек модератор форума (1..5)
; и с какого — администратор форума (может всё: удалять, переносить, редактировать чужое).
moderator_level = 1
admin_level = 4

; Discord или другой сайт (кнопка в шапке). Пусто — кнопки нет.
discord =

; ----------------------------------------------------------------
;  Игровые сервера. Форум берёт из их баз ники, пароли, уровень,
;  фракцию и админку. Базу форум только ЧИТАЕТ, ничего в ней не меняет.
;  db — путь к rp.db (обычно папка scriptfiles сервера).
;  Относительный путь считается от папки форума.
; ----------------------------------------------------------------

[server:peace]
name = Bastion Peace
db = C:\openmp\Server\scriptfiles\rp.db
address = 127.0.0.1
port = 7777

[server:war]
name = Bastion War
db = C:\openmp\ServerWar\scriptfiles\rp.db
address = 127.0.0.1
port = 7778
