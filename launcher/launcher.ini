; ================================================================
;  Настройки лаунчера Bastion Online
;  Строки, начинающиеся с ; — комментарии.
; ================================================================

title = Bastion Online

; Требовать ник вида Имя_Фамилия (как на сервере)
require_rp_name = true

; Сайт или Discord (кнопка в лаунчере). Пусто = кнопки нет.
site =

; Кнопки вверху окна (до 4): link = НАЗВАНИЕ | ссылка. Строки link в servers.ini
; на сервере раздачи важнее этих.
; link = ФОРУМ | https://forum.example.com
; link = ДОНАТ | https://example.com/donate

; Новости, список серверов и обновления лаунчер берёт из сети сам: из папки launcher/
; на сервере раздачи игры (news.txt, servers.ini, version.ini). Если сети нет, берётся
; последнее скачанное (news.cache, servers.cache), а если и его нет — news.txt рядом
; с лаунчером и строки server ниже.
; Сюда можно вписать свою ссылку, а знак - (минус) выключает загрузку из сети.
news_url =
servers_url =
update_url =
; Проверка и докачка файлов игры перед запуском (client-pack.json, см. ROADMAP.md)
client_pack_url = https://raw.githubusercontent.com/betjnldhuch/bastion/main/launcher/client-pack/client-pack.json
; Красивые окна сервера на ПК, как на телефоне (bastion_ui.asi): лаунчер ставит и обновляет
; их сам из релиза bastion-ui на GitHub. Своя ссылка на BastionUI-PC.zip или - (не ставить).
ui_url =

; Архив игры для кнопки УСТАНОВИТЬ (ZIP, внутри gta_sa.exe и samp.exe) и его MD5.
; Пусто = архив Bastion, вшитый в лаунчер при сборке (закрытая раздача).
; Ссылки: прямая https, GitHub Releases или Яндекс Диск (disk.yandex.ru/d/…). Большой
; архив можно нарезать на части и перечислить через |. Зеркала (те же файлы в другом
; месте) — через ; : если одно не отдаёт файл, лаунчер докачает с другого.
; Пример: game_url = https://github.com/…/game.zip.part1 | …part2 ; https://disk.yandex.ru/d/A | https://disk.yandex.ru/d/B
game_url =
game_md5 =

; Сервера:  server = Название | адрес | порт | описание
; Адрес: 127.0.0.1 — свой компьютер; IP из Radmin VPN — для друзей;
; потом сюда впишешь адрес хостинга.
server = Bastion Peace | 192.168.31.182 | 7777 | Классический RP, как в старые добрые времена
server = Bastion War   | 192.168.31.182 | 7778 | Сервер для сильнейших. Никакой администрации — всё решаешь ты
