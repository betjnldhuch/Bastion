; ================================================================
;  Настройки лаунчера Bastion Online
;  Строки, начинающиеся с ; — комментарии.
; ================================================================

title = Bastion Online

; Требовать ник вида Имя_Фамилия (как на сервере)
require_rp_name = true

; Сайт или Discord (кнопка в лаунчере). Пусто = кнопки нет.
site =

; Новости, список серверов и обновления лаунчер берёт из сети сам: из папки launcher/
; на сервере раздачи игры (news.txt, servers.ini, version.ini). Если сети нет, берётся
; последнее скачанное (news.cache, servers.cache), а если и его нет — news.txt рядом
; с лаунчером и строки server ниже.
; Сюда можно вписать свою ссылку, а знак - (минус) выключает загрузку из сети.
news_url =
servers_url =
update_url =

; Архив игры для кнопки УСТАНОВИТЬ (ZIP, внутри gta_sa.exe и samp.exe) и его MD5.
; Пусто = архив Bastion, вшитый в лаунчер при сборке (закрытая раздача).
game_url =
game_md5 =

; Сервера:  server = Название | адрес | порт | описание
; Адрес: 127.0.0.1 — свой компьютер; IP из Radmin VPN — для друзей;
; потом сюда впишешь адрес хостинга.
server = Bastion Peace | 127.0.0.1 | 7777 | Классический RP, как в старые добрые времена
server = Bastion War   | 127.0.0.1 | 7778 | Сервер для сильнейших. Никакой администрации — всё решаешь ты
