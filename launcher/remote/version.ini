; Свежие версии лаунчеров Bastion Online. Файл лежит в бакете R2: launcher/version.ini
; Лаунчер сравнивает номер со своим и, если здесь больше, предлагает обновиться.
; Сначала залей файл обновления в ту же папку, потом меняй номер здесь.

; ПК: номер как в AssemblyVersion (launcher/source/Core.cs), файл — ZIP со сборки.
pc_version = 2.3.0.0
pc_url = BastionLauncher.zip
; необязательно: certutil -hashfile BastionLauncher.zip SHA256
pc_sha256 =
pc_notes =

; Телефон: номер как versionCode в mobile/launcher/app/build.gradle.
android_version_code = 15
android_url = Bastion.apk
android_notes =
