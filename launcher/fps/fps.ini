; ================================================================
;  Пакет FPS лаунчера Bastion Online (см. README.txt рядом)
; ================================================================

; Файл настроек плагина снятия лимита (лежит в папке GTA).
; Лаунчер впишет туда выбранный лимит: <limiter_key>=120
; Для ModernFpsLimit: limiter_ini = ModernFpsLimit.ini, limiter_key = fps
limiter_ini = ModernFpsLimit.ini
limiter_key = fps

; Максимум, который лаунчер покажет в настройках (120 / 144 / 165)
max_fps = 165
