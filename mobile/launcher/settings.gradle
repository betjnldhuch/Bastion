pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
}
dependencyResolutionManagement {
    repositories {
        google()
        mavenCentral()
        // SAMP-Mobile: PRDownloader is published on JitPack.
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "BastionLauncher"
include ':app', ':samp'
// Embedded game client: SAMP-Mobile (branch GTA-2.11), pinned as a git submodule.
// CI runs mobile/samp-mobile-patches/apply.py on it first (app -> library).
project(':samp').projectDir = file('../samp-mobile/app')
