; ================================================================
;  Bastion Online — настройки сборки Android-лаунчера
;  Игрок эти значения не видит и не меняет. Меняешь ты перед сборкой APK.
;  Формат: ключ = значение. Строки, начинающиеся с ; — комментарии.
; ================================================================

; Логотип на главном экране: title — белым, subtitle — оранжевым.
title = BASTION
subtitle = ONLINE

; Требовать ник вида Имя_Фамилия (как на сервере).
require_rp_name = true

; ---------------------------------------------------------------
;  Сервера
;  server = Название | адрес | порт | описание | пароль
;  Описание и пароль необязательны.
;  127.0.0.1 на телефоне — это сам телефон. Для теста дома укажи
;  адрес компьютера в Wi-Fi сети (например 192.168.1.10).
; ---------------------------------------------------------------
server = Bastion Peace | 192.168.1.10 | 7777 | Классический RP, как в старые добрые времена
server = Bastion War   | 192.168.1.10 | 7778 | Сервер для сильнейших. Никакой администрации — всё решаешь ты

; true  — адреса в Настройках только для чтения, всегда берутся отсюда
;         (сохранённые игроком адреса игнорируются).
; false — игрок может вписать свой адрес и порт (удобно для тестов).
lock_servers = false

; Как часто обновлять онлайн и пинг, секунды (3–600).
poll_interval = 10

; ---------------------------------------------------------------
;  Игра
;  game_activity — Activity игры, которую запускает кнопка ИГРАТЬ.
;  game_package  — пусто, если игра собрана в этом же APK (так и нужно:
;                  мод читает SAMP/settings.ini из папки этого приложения).
; ---------------------------------------------------------------
game_package =
game_activity = com.rockstargames.gtasa.GTASA

; Файлы кеша (относительно Android/data/<пакет>/files/), без которых
; запуск не имеет смысла. Это файлы, которые мод проверяет в checkfilehash.cpp.
require_file = SAMP/main.scm
require_file = SAMP/script.img
require_file = SAMP/vehicles.ide
require_file = SAMP/peds.ide
require_file = SAMP/handling.cfg
