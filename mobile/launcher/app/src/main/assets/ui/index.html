<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bastion UI</title>
<!--
  HTML-окна Bastion поверх игры (Android).
  Сервер (ui.inc) шлёт диалог с заголовком "[ui:ИМЯ]" и JSON в тексте.
  Клиент вызывает BastionUI.open({window, button1, button2, data}).
  Ответ: BastionNative.respond(кнопка 1/0, пункт списка, текст) — придёт в OnDialogResponse.
  Новое окно = новая функция в WINDOWS.
-->
<style>
@font-face { font-family: "Russo One"; src: url("../fonts/RussoOne-Regular.ttf"); }
:root {
  --bg: rgba(8, 9, 12, .72);
  --panel: #14161a; --panel-hi: #1b1e23; --line: #2a2d33;
  --text: #ececec; --muted: #8c9098; --dim: #5a5f68;
  --accent: #ff7a1a; --accent-dark: #c2540a; --green: #4cd07d; --red: #e5484d; --gold: #ffc940;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: transparent; color: var(--text);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; }
#root { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(8,9,12,.45), var(--bg)); padding: 16px; }
#root.on { display: flex; animation: fade .18s ease-out; }
@keyframes fade { from { opacity: 0 } to { opacity: 1 } }
@keyframes rise { from { transform: translateY(12px) scale(.98); opacity: 0 } to { transform: none; opacity: 1 } }
.card { width: min(420px, 100%); max-height: 100%; overflow: auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; padding: 22px 22px 18px;
  box-shadow: 0 18px 60px rgba(0,0,0,.55); animation: rise .22s ease-out; position: relative; }
.card.wide { width: min(560px, 100%); }
.brand { font-family: "Russo One", sans-serif; letter-spacing: .08em; font-size: 12px; color: var(--accent); }
h1 { font-family: "Russo One", sans-serif; font-weight: 400; font-size: 24px; margin: 4px 0 6px; }
@media (max-height: 420px) { .card { padding: 14px 18px 12px; } h1 { font-size: 20px; } p.sub { margin-bottom: 10px; }
  .card.shop { padding: 12px 16px; } .shop .good { padding: 8px 10px 8px 50px; gap: 2px; justify-content: center; min-height: 60px; }
  .shop .good .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 26px; } .note { padding: 6px 10px; } .good .d { display: none; } .buy { margin-bottom: 8px; } .buy .ico { width: 48px; height: 48px; font-size: 28px; } .shop-head { margin-bottom: 8px; } .note { margin-bottom: 8px; } }
p.sub { margin: 0 0 16px; color: var(--muted); }
p.sub b { color: var(--text); font-weight: 600; }
.close { position: absolute; top: 12px; right: 12px; width: 34px; height: 34px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--panel-hi); color: var(--muted); font-size: 18px; }
label { display: block; font-size: 12px; color: var(--muted); margin: 0 0 6px; }
.field { position: relative; margin-bottom: 12px; }
input { width: 100%; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: #0e1013;
  color: var(--text); font-size: 17px; padding: 0 46px 0 14px; outline: none; user-select: text; }
input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,122,26,.18); }
.eye { position: absolute; right: 6px; top: 6px; width: 34px; height: 34px; border: 0; background: none;
  color: var(--muted); font-size: 16px; }
.hint { font-size: 12px; color: var(--dim); margin: -4px 0 12px; }
.error { display: none; background: rgba(229,72,77,.12); border: 1px solid rgba(229,72,77,.4); color: #ff9a9d;
  border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; }
.error.on { display: block; }
.row { display: flex; gap: 10px; margin-top: 6px; }
button { font: inherit; cursor: pointer; }
.btn { flex: 1; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel-hi);
  color: var(--text); font-weight: 600; }
.btn.primary { background: linear-gradient(180deg, var(--accent), var(--accent-dark)); border-color: transparent; color: #fff;
  font-family: "Russo One", sans-serif; letter-spacing: .04em; font-weight: 400; }
.btn:active { transform: translateY(1px); filter: brightness(.95); }
.btn[disabled] { opacity: .45; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 14px; }
.choice { height: 120px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-hi); color: var(--text);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; font-size: 16px; }
.choice .ico { font-size: 40px; line-height: 1; }
.choice.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: rgba(255,122,26,.08); }
.card.wide { display: flex; flex-direction: column; }
.card.wide > * { flex: none; }
.card.wide > .rules { flex: 1 1 auto; min-height: 64px; }
.rules { list-style: none; margin: 0 0 14px; padding: 0; overflow: auto; border: 1px solid var(--line);
  border-radius: 10px; background: #0e1013; }
.rules li { display: flex; gap: 12px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.rules li:last-child { border-bottom: 0; }
.rules .n { flex: none; width: 24px; height: 24px; border-radius: 6px; background: rgba(255,122,26,.14); color: var(--accent);
  font-family: "Russo One", sans-serif; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.rules b { display: block; font-weight: 600; margin-bottom: 2px; }
.rules span { color: var(--muted); font-size: 13px; }
.agree { display: flex; align-items: center; gap: 10px; margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.agree input { width: 20px; height: 20px; padding: 0; accent-color: var(--accent); flex: none; }
.text { white-space: pre-wrap; color: var(--muted); margin-bottom: 14px; }
/* --- Донат --- */
.card.shop { width: min(660px, 100%); display: flex; flex-direction: column; }
.shop-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 40px 12px 0; flex-wrap: wrap; }
.shop-head h1 { margin: 2px 0 0; }
.wallet { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel-hi); font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill b { color: var(--text); font-family: "Russo One", sans-serif; font-weight: 400; font-size: 15px; }
.pill.gold { border-color: rgba(255,201,64,.45); background: rgba(255,201,64,.08); }
.pill.gold b { color: var(--gold); }
.pill.vip { border-color: rgba(255,201,64,.6); color: var(--gold); }
.coin { width: 16px; height: 16px; border-radius: 50%; flex: none; background: radial-gradient(circle at 35% 30%, #fff3b0, var(--gold) 45%, #b8860b);
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.25); }
.note { border-radius: 10px; padding: 8px 12px; margin-bottom: 12px; font-size: 13px; animation: rise .22s ease-out; }
.note.ok { background: rgba(76,208,125,.12); border: 1px solid rgba(76,208,125,.4); color: #9ff0be; }
.note.bad { background: rgba(229,72,77,.12); border: 1px solid rgba(229,72,77,.4); color: #ff9a9d; }
.goods { display: grid; grid-template-columns: repeat(3, 1fr); grid-auto-rows: max-content; gap: 10px; overflow: auto; min-height: 0; flex: 1 1 auto; }
@media (max-width: 520px) { .goods { grid-template-columns: 1fr 1fr; } }
.good { text-align: left; border-radius: 12px; border: 1px solid var(--line); background: var(--panel-hi); color: var(--text);
  padding: 12px; display: flex; flex-direction: column; gap: 4px; position: relative; overflow: hidden; }
.good::after { content: ""; position: absolute; inset: auto -30px -30px auto; width: 90px; height: 90px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,122,26,.16), transparent 70%); }
.good.top { border-color: rgba(255,201,64,.5); background: linear-gradient(160deg, rgba(255,201,64,.10), var(--panel-hi) 60%); }
.good .ico { font-size: 26px; line-height: 1; }
.good b { font-weight: 600; font-size: 14px; }
.good .d { color: var(--muted); font-size: 12px; line-height: 1.3; flex: 1; }
.good .price { display: flex; align-items: center; gap: 5px; font-family: "Russo One", sans-serif; font-size: 14px; color: var(--gold); }
.good .price.no { color: var(--dim); }
.good .tag { position: absolute; top: 10px; right: 10px; font-size: 10px; letter-spacing: .06em; padding: 2px 6px; border-radius: 6px;
  background: var(--gold); color: #1a1406; font-weight: 700; }
.good:active { transform: translateY(1px); border-color: var(--accent); }
.shop-foot { color: var(--dim); font-size: 12px; margin-top: 10px; }
.buy { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 12px; }
.buy .ico { font-size: 40px; line-height: 1; width: 64px; height: 64px; flex: none; border-radius: 14px; background: var(--panel-hi);
  border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; }
.buy h1 { margin: 0 0 4px; font-size: 22px; }
.buy p { margin: 0; color: var(--muted); font-size: 13px; }
.packs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
@media (max-width: 520px) { .packs { grid-template-columns: 1fr 1fr; } }
.pack { border-radius: 10px; border: 1px solid var(--line); background: var(--panel-hi); color: var(--text); padding: 10px 6px; text-align: center; }
.pack b { display: flex; align-items: center; justify-content: center; gap: 5px; font-family: "Russo One", sans-serif; font-weight: 400; font-size: 16px; color: var(--gold); }
.pack span { display: block; color: var(--green); font-size: 13px; margin-top: 2px; }
.pack.sel { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: rgba(255,122,26,.08); }
.pack[disabled] { opacity: .4; }
.total { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 10px;
  background: #0e1013; border: 1px solid var(--line); margin-bottom: 12px; font-size: 13px; color: var(--muted); }
.total b { display: flex; align-items: center; gap: 6px; font-family: "Russo One", sans-serif; font-weight: 400; font-size: 16px; color: var(--gold); }
.total.short b { color: var(--red); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var root = document.getElementById('root');
  var current = null;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  // {RRGGBB} — цвета SA-MP в тексте: убираем
  function plain(s) { return String(s == null ? '' : s).replace(/\{[0-9a-fA-F]{6}\}/g, ''); }

  function respond(button, listitem, text) {
    if (!current) return;
    current = null;
    root.classList.remove('on');
    root.innerHTML = '';
    if (window.BastionNative) BastionNative.respond(button, listitem, text || '');
    else console.log('respond', button, listitem, text);
  }

  function errorBox(msg) { return '<div class="error' + (msg ? ' on' : '') + '" id="err">' + esc(msg) + '</div>'; }
  function closeBtn() { return '<button class="close" id="x" aria-label="Закрыть">✕</button>'; }

  function passwordForm(opt) {
    // opt: title, sub, button1, button2, min, max, error
    root.innerHTML =
      '<form class="card" id="f" autocomplete="off">' + closeBtn() +
      '<div class="brand">BASTION ONLINE</div>' +
      '<h1>' + esc(opt.title) + '</h1>' +
      '<p class="sub">' + opt.sub + '</p>' +
      errorBox(opt.error) +
      '<label for="pw">Пароль</label>' +
      '<div class="field"><input id="pw" type="password" maxlength="' + (opt.max || 64) + '">' +
      '<button type="button" class="eye" id="eye" aria-label="Показать пароль">👁</button></div>' +
      (opt.hint ? '<div class="hint">' + esc(opt.hint) + '</div>' : '') +
      '<div class="row">' +
      (opt.button2 ? '<button type="button" class="btn" id="b2">' + esc(opt.button2) + '</button>' : '') +
      '<button type="submit" class="btn primary" id="b1">' + esc(opt.button1 || 'OK') + '</button></div></form>';
    var pw = document.getElementById('pw'), err = document.getElementById('err');
    document.getElementById('eye').onclick = function () { pw.type = pw.type === 'password' ? 'text' : 'password'; pw.focus(); };
    document.getElementById('x').onclick = function () { respond(0, -1, ''); };
    var b2 = document.getElementById('b2'); if (b2) b2.onclick = function () { respond(0, -1, ''); };
    document.getElementById('f').onsubmit = function (e) {
      e.preventDefault();
      var v = pw.value;
      if (opt.min && (v.length < opt.min || v.length > opt.max)) {
        err.textContent = 'Пароль должен быть от ' + opt.min + ' до ' + opt.max + ' символов.';
        err.classList.add('on'); pw.focus(); return;
      }
      respond(1, -1, v);
    };
    setTimeout(function () { pw.focus(); }, 50);
  }

  var WINDOWS = {
    login: function (d, m) {
      passwordForm({ title: 'С возвращением', sub: 'Аккаунт <b>' + esc(d.name) + '</b>. Введи пароль, чтобы войти.',
        button1: m.button1, button2: m.button2, error: d.error });
    },
    register: function (d, m) {
      passwordForm({ title: 'Регистрация', sub: 'Добро пожаловать, <b>' + esc(d.name) + '</b>! Придумай пароль для аккаунта.',
        button1: m.button1, button2: m.button2, min: d.min, max: d.max, error: d.error,
        hint: 'От ' + d.min + ' до ' + d.max + ' символов. Никому его не сообщай.' });
    },
    gender: function (d, m) {
      var sel = -1;
      root.innerHTML = '<div class="card"><div class="brand">BASTION ONLINE</div><h1>Твой персонаж</h1>' +
        '<p class="sub">Выбери пол персонажа. Внешность можно будет сменить позже.</p>' +
        '<div class="choices"><button class="choice" data-i="0"><span class="ico">🧔</span>Мужской</button>' +
        '<button class="choice" data-i="1"><span class="ico">👩</span>Женский</button></div>' +
        '<div class="row"><button class="btn primary" id="b1" disabled>' + esc(m.button1 || 'Выбрать') + '</button></div></div>';
      var b1 = document.getElementById('b1');
      Array.prototype.forEach.call(root.querySelectorAll('.choice'), function (el) {
        el.onclick = function () {
          sel = +el.getAttribute('data-i');
          Array.prototype.forEach.call(root.querySelectorAll('.choice'), function (o) { o.classList.toggle('sel', o === el); });
          b1.disabled = false;
        };
      });
      b1.onclick = function () { if (sel >= 0) respond(1, sel, ''); };
    },
    rules: function (d, m) {
      var items = (d.rules || []).map(function (r, i) {
        return '<li><div class="n">' + (i + 1) + '</div><div><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div></li>';
      }).join('');
      root.innerHTML = '<div class="card wide">' + closeBtn() + '<div class="brand">BASTION ONLINE</div><h1>Правила сервера</h1>' +
        '<p class="sub">Прочитай перед началом игры. За нарушения дают предупреждения, тюрьму или бан.</p>' +
        '<ul class="rules">' + items + '</ul>' +
        '<label class="agree"><input type="checkbox" id="ok"> Я прочитал правила и согласен с ними</label>' +
        '<div class="row"><button class="btn" id="b2">' + esc(m.button2 || 'Выход') + '</button>' +
        '<button class="btn primary" id="b1" disabled>' + esc(m.button1 || 'Принимаю') + '</button></div></div>';
      var b1 = document.getElementById('b1');
      document.getElementById('ok').onchange = function () { b1.disabled = !this.checked; };
      b1.onclick = function () { respond(1, -1, ''); };
      document.getElementById('b2').onclick = document.getElementById('x').onclick = function () { respond(0, -1, ''); };
    },
    referral: function (d, m) {
      root.innerHTML = '<form class="card" id="f" autocomplete="off"><div class="brand">BASTION ONLINE</div><h1>Кто тебя пригласил?</h1>' +
        '<p class="sub">Если на сервер тебя позвал друг, впиши его ник. Никто не звал — просто пропусти.</p>' +
        errorBox(d.error) +
        '<label for="nick">Ник друга</label><div class="field"><input id="nick" placeholder="Имя_Фамилия" maxlength="24" autocapitalize="off" spellcheck="false"></div>' +
        '<div class="row"><button type="button" class="btn" id="b2">' + esc(m.button2 || 'Пропустить') + '</button>' +
        '<button type="submit" class="btn primary">' + esc(m.button1 || 'Далее') + '</button></div></form>';
      var nick = document.getElementById('nick'), err = document.getElementById('err');
      document.getElementById('b2').onclick = function () { respond(0, -1, ''); };
      document.getElementById('f').onsubmit = function (e) {
        e.preventDefault();
        var v = nick.value.trim();
        if (!v) { respond(0, -1, ''); return; }
        if (!/^[A-Za-z]+_[A-Za-z_]+$/.test(v)) { err.textContent = 'Ник пишется как Имя_Фамилия, латиницей.'; err.classList.add('on'); return; }
        respond(1, -1, v);
      };
    },
    // Донат: магазин -> карточка товара -> ответ "товар аргумент" (donate.inc)
    donate: function (d, m) {
      var coins = d.coins | 0, prices = d.prices || [], rate = d.rate || 1000;
      var packs = d.packs || [10, 50, 100, 500];
      function money(n) { return '$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
      function coin(n) { return '<i class="coin"></i>' + n; }
      var goods = [
        { ico: '💵', t: 'Игровые деньги', s: '1 монета = ' + money(rate) + '. Пачки от ' + packs[0] + ' монет.', p: packs[0] },
        { ico: '👑', t: 'VIP на ' + d.vipDays + ' дней', s: '+' + money(d.vipPayday) + ' и двойной опыт каждый PayDay, тег [VIP].', top: 1,
          tag: d.vip > 0 ? 'ПРОДЛИТЬ' : 'ХИТ' },
        { ico: '👕', t: 'Любой скин', s: 'Скин 1–311 навсегда, ляжет в сумку как одежда.' },
        { ico: '⭐', t: '+1 уровень', s: 'Сразу следующий уровень персонажа.' },
        { ico: '🧽', t: 'Снять предупреждения', s: d.warns > 0 ? 'Сейчас предупреждений: ' + d.warns + '. Снимем все.' : 'У тебя нет предупреждений.',
          off: !(d.warns > 0) && 'Предупреждений нет' },
        { ico: '📱', t: 'Свой номер', s: 'Красивый номер из 3–7 цифр, например 777.', off: !d.phone && 'Сначала купи телефон в 24/7' }
      ];
      goods.forEach(function (g, i) { if (i) g.p = prices[i] | 0; });

      function head() {
        return closeBtn() + '<div class="shop-head"><div><div class="brand">BASTION ONLINE</div><h1>Донат</h1></div>' +
          '<div class="wallet">' + (d.vip > 0 ? '<div class="pill vip">👑 VIP ещё <b>' + d.vip + '</b> дн.</div>' : '') +
          '<div class="pill gold"><i class="coin"></i><b>' + coins + '</b> монет</div></div></div>';
      }
      function bindClose() { document.getElementById('x').onclick = function () { respond(0, -1, ''); }; }

      function list(note, ok) {
        root.innerHTML = '<div class="card shop">' + head() +
          (note ? '<div class="note ' + (ok ? 'ok' : 'bad') + '">' + esc(plain(note)) + '</div>' : '') +
          '<div class="goods">' + goods.map(function (g, i) {
            return '<button class="good' + (g.top ? ' top' : '') + '" data-i="' + i + '">' +
              (g.tag ? '<em class="tag">' + g.tag + '</em>' : '') + '<span class="ico">' + g.ico + '</span>' +
              '<b>' + esc(g.t) + '</b><span class="d">' + esc(g.s) + '</span>' +
              '<div class="price' + (coins < g.p ? ' no' : '') + '">' + (i === 0 ? 'от ' : '') + coin(g.p) + '</div></button>';
          }).join('') + '</div>' +
          '<div class="shop-foot">Монеты зачисляет администрация после оплаты. Все покупки записываются в журнал.</div></div>';
        bindClose();
        Array.prototype.forEach.call(root.querySelectorAll('.good'), function (el) {
          el.onclick = function () { item(+el.getAttribute('data-i')); };
        });
      }

      function item(i) {
        var g = goods[i], sel = -1, body = '';
        if (i === 0) {
          body = '<div class="packs">' + packs.map(function (n, k) {
            return '<button class="pack" data-k="' + k + '"' + (coins < n ? ' disabled' : '') + '><b>' + coin(n) + '</b><span>' + money(n * rate) + '</span></button>';
          }).join('') + '</div>';
        } else if (i === 2 || i === 5) {
          body = '<label for="v">' + (i === 2 ? 'Номер скина (1–311)' : 'Новый номер (3–7 цифр, не с нуля)') + '</label>' +
            '<div class="field"><input id="v" type="tel" inputmode="numeric" maxlength="' + (i === 2 ? 3 : 7) + '" placeholder="' + (i === 2 ? '105' : '777') + '"></div>';
        }
        root.innerHTML = '<form class="card shop" id="f" autocomplete="off">' + head() +
          '<div class="buy"><div class="ico">' + g.ico + '</div><div><h1>' + esc(g.t) + '</h1><p>' + esc(g.s) + '</p></div></div>' +
          errorBox('') + body + '<div class="total" id="tot"></div>' +
          '<div class="row"><button type="button" class="btn" id="b2">Назад</button>' +
          '<button type="submit" class="btn primary" id="b1">' + (i === 0 ? 'Обменять' : 'Купить') + '</button></div></form>';
        bindClose();
        var b1 = document.getElementById('b1'), tot = document.getElementById('tot'), err = document.getElementById('err');
        var v = document.getElementById('v');
        function price() { return i === 0 ? (sel >= 0 ? packs[sel] : 0) : g.p; }
        function upd() {
          var p = price(), short = p > coins;
          tot.className = 'total' + (short ? ' short' : '');
          tot.innerHTML = (i === 0 && sel < 0) ? 'Выбери пачку монет' :
            (short ? 'Не хватает ' + (p - coins) + ' монет' : 'Останется ' + (coins - p) + ' монет') + '<b>' + coin('−' + p) + '</b>';
          b1.disabled = !!g.off || short || (i === 0 && sel < 0);
          if (g.off) tot.textContent = g.off;
        }
        Array.prototype.forEach.call(root.querySelectorAll('.pack'), function (el) {
          el.onclick = function () {
            sel = +el.getAttribute('data-k');
            Array.prototype.forEach.call(root.querySelectorAll('.pack'), function (o) { o.classList.toggle('sel', o === el); });
            upd();
          };
        });
        if (i === 0) { for (var k = packs.length - 1; k >= 0; k--) if (packs[k] <= coins) { sel = k; break; }
          if (sel >= 0) root.querySelectorAll('.pack')[sel].classList.add('sel'); }
        document.getElementById('b2').onclick = function () { list('', true); };
        document.getElementById('f').onsubmit = function (e) {
          e.preventDefault();
          if (b1.disabled) return;
          var arg = '';
          if (i === 0) arg = String(sel);
          if (v) {
            arg = v.value.trim();
            var n = +arg, bad = !/^\d+$/.test(arg) ||
              (i === 2 ? (n < 1 || n > 311 || n === 74) : (arg.length < 3 || arg.length > 7 || arg[0] === '0'));
            if (bad) { err.textContent = i === 2 ? 'Скин — число от 1 до 311.' : 'Номер — 3–7 цифр и не с нуля.'; err.classList.add('on'); v.focus(); return; }
          }
          respond(1, i, i + (arg ? ' ' + arg : ''));
        };
        upd();
        if (v) setTimeout(function () { v.focus(); }, 50);
      }

      list(d.note, d.ok);
    },
    // Запасное окно: заголовок + текст + кнопки
    message: function (d, m) {
      root.innerHTML = '<div class="card">' + closeBtn() + '<div class="brand">BASTION ONLINE</div>' +
        '<h1>' + esc(plain(d.title)) + '</h1><div class="text">' + esc(plain(d.text)) + '</div><div class="row">' +
        (m.button2 ? '<button class="btn" id="b2">' + esc(m.button2) + '</button>' : '') +
        '<button class="btn primary" id="b1">' + esc(m.button1 || 'OK') + '</button></div></div>';
      document.getElementById('x').onclick = function () { respond(0, -1, ''); };
      document.getElementById('b1').onclick = function () { respond(1, -1, ''); };
      var b2 = document.getElementById('b2'); if (b2) b2.onclick = function () { respond(0, -1, ''); };
    }
  };

  window.BastionUI = {
    open: function (msg) {
      var data = {};
      try { data = typeof msg.data === 'string' ? JSON.parse(msg.data) : (msg.data || {}); } catch (e) { data = { text: msg.data }; }
      var fn = WINDOWS[msg.window] || WINDOWS.message;
      current = msg.window;
      fn(data, msg);
      root.classList.add('on');
    },
    close: function () { respond(0, -1, ''); }
  };

  // Предпросмотр в браузере ПК: index.html#login / #register / #gender / #donate
  if (!window.BastionNative && location.hash) {
    BastionUI.open({ window: location.hash.slice(1), button1: 'Войти', button2: 'Выход',
      data: { name: 'Ivan_Petrov', min: 6, max: 32, coins: 420, vip: 0, rate: 1000, packs: [10, 50, 100, 500], vipDays: 30, vipPayday: 2000,
        prices: [0, 300, 150, 200, 100, 150], warns: 1, phone: 1, note: 'Обмен: 50 монет -> $50000.', ok: 1, rules: [['Ролевая игра', 'Веди себя как житель города. Не выходи из роли без причины (NonRP).'], ['DM и DB', 'Нельзя убивать без RP-причины (DM) и давить игроков машиной (DB).'], ['Читы и баги', 'Запрещены читы, сторонние программы и использование ошибок сервера.']] } });
    document.body.style.background = '#2b3440';
  }
})();
</script>
