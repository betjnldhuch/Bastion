plugins {
    id 'com.android.application'
}

android {
    namespace 'online.bastion.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'online.bastion.launcher'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName "0.2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
