plugins {
    id 'com.android.application'
}

android {
    namespace 'online.bastion.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'online.bastion.launcher'
        minSdk 24
        targetSdk 34
        versionCode 7
        versionName "0.6.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':sampdroid')
}
