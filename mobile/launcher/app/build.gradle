plugins {
    id 'com.android.application'
}

String envOr(String name, String fallback) {
    String v = System.getenv(name)
    return (v == null || v.trim().isEmpty()) ? fallback : v.trim()
}

String quoted(String v) {
    return '"' + v.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace 'online.bastion.launcher'
    compileSdk 36

    defaultConfig {
        applicationId 'online.bastion.launcher'
        // SAMP-Mobile GTA-2.11 requires Android 9+ (API 28) and ARM64.
        minSdk 28
        targetSdk 34
        versionCode 14
        versionName "0.7.2"
        multiDexEnabled true

        ndk {
            abiFilters 'arm64-v8a'
        }

        // Архив игры и ключ закрытой раздачи (cloud/download-worker) приходят из
        // секретов GitHub Actions, в репозитории их нет. Без них — домашний сервер.
        buildConfigField 'String', 'GAME_ARCHIVE_URL', quoted(envOr('BASTION_GAME_URL', 'http://192.168.31.182:8000/game.zip'))
        buildConfigField 'String', 'GAME_ARCHIVE_MD5', quoted(envOr('BASTION_GAME_MD5', '57A0F9765B2C229FD814E11D36F5EF00'))
        buildConfigField 'String', 'DOWNLOAD_KEY', quoted(envOr('BASTION_DOWNLOAD_KEY', ''))
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Stable debug key from the repo, so CI builds can be installed over each other.
        debug {
            storeFile file('../tools/debug.keystore')
            storePassword 'android'
            keyAlias 'bastiondebug'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            // Keep .so files uncompressed and 16 KB-aligned inside the APK
            // (Android 15+ devices with 16 KB memory pages).
            useLegacyPackaging false
            // The SAMP-Mobile module ships these both from jniLibs/AAR and as
            // CMake/prefab-linked copies: same library, package one.
            pickFirsts += ['**/libshadowhook.so', '**/libbass.so', '**/libbass_ssl.so',
                           '**/libGlossHook.so', '**/libc++_shared.so']
            // Crash diagnostics: keep the symbol table of the client library,
            // so native tombstones on the device contain function names.
            keepDebugSymbols += ['**/libsamp.so']
        }
        resources {
            excludes += ['META-INF/*']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation project(':samp')
}
