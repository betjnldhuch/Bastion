plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android' version '1.9.24'
}

// Copy upstream client resources, omitting its standalone-app identity assets.
// Bastion supplies the application label and launcher icons for the combined APK.
def clientResRoot = file('../../client/sampdroid/app/src/main/res')
def bastionClientRes = layout.buildDirectory.dir('generated/bastionClientRes')
tasks.register('prepareBastionClientResources') {
    inputs.dir(clientResRoot)
    outputs.dir(bastionClientRes)
    doLast {
        if (!clientResRoot.exists()) {
            throw new GradleException('Embedded Android client resources are missing. Run git submodule update --init --recursive.')
        }
        def output = bastionClientRes.get().asFile
        delete(output)
        project.copy { from clientResRoot; into output }
        fileTree(output).matching { include 'mipmap-*/ic_launcher.*' }.files.each { delete(it) }
        def strings = new File(output, 'values/strings.xml')
        if (strings.exists()) {
            def xml = strings.getText('UTF-8')
            xml = xml.replaceAll(/(?s)\\s*<string\\s+name="app_name"[^>]*>.*?<\\/string>/, '')
            strings.setText(xml, 'UTF-8')
        }
    }
}

android {
    namespace 'com.xykal.sampdroid'
    compileSdk 34
    ndkVersion '26.1.10909125'

    defaultConfig {
        applicationId 'online.bastion.launcher'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.3.0"

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17', '-O2', '-fexceptions', '-frtti'
                arguments '-DANDROID_STL=c++_shared'
            }
        }
    }

    sourceSets {
        main {
            res.srcDirs += [bastionClientRes]
            assets.srcDirs += ['../../client/sampdroid/app/src/main/assets']
            java.srcDir layout.buildDirectory.dir('generated/bastionClientSources')
        }
    }

    externalNativeBuild {
        cmake {
            path file('../../client/sampdroid/app/src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
}

// Build a Bastion-branded copy of the client entry screen. The original
// upstream source remains untouched in the pinned submodule.
def clientJavaRoot = file('../../client/sampdroid/app/src/main/java')
def brandedClientMainActivity = layout.buildDirectory.file(
    'generated/bastionClientSources/com/xykal/sampdroid/ui/MainActivity.kt'
)
tasks.register('generateBastionClientSources') {
    inputs.dir(clientJavaRoot)
    outputs.dir(layout.buildDirectory.dir('generated/bastionClientSources'))
    doLast {
        if (!clientJavaRoot.exists()) {
            throw new GradleException('Embedded Android client source is missing. Run git submodule update --init --recursive.')
        }
        def generatedRoot = layout.buildDirectory.dir('generated/bastionClientSources').get().asFile
        project.copy {
            from clientJavaRoot
            into generatedRoot
        }
        def entry = new File(generatedRoot, 'com/xykal/sampdroid/ui/MainActivity.kt')
        def source = entry.getText('UTF-8')
        source = source.replace('title = "SampDroid"', 'title = "Bastion Online"')
        source = source.replace('native SA-MP client · v', 'Bastion multiplayer · v')
        source = source.replace(
            '        loadServers()\n    }',
            '        loadServers()\n' +
            '        if (getSharedPreferences("bastion_bridge", MODE_PRIVATE).getBoolean("open_server_on_launch", false)) {\n' +
            '            getSharedPreferences("bastion_bridge", MODE_PRIVATE).edit().remove("open_server_on_launch").apply()\n' +
            '            window.decorView.post { connectUifFavorite() }\n' +
            '        }\n' +
            '    }'
        )
        entry.setText(source, 'UTF-8')
    }
}
tasks.named('preBuild').configure {
    dependsOn tasks.named('generateBastionClientSources')
    dependsOn tasks.named('prepareBastionClientResources')
}
