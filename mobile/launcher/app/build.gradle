plugins {
    id 'com.android.application'
}

android {
    namespace 'online.bastion.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'online.bastion.launcher'
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "0.3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Юнит-тесты ядра (пакет core). Запуск: gradle :app:testDebugUnitTest
    testImplementation 'junit:junit:4.13.2'
}
