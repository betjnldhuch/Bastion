name: Build Bastion PC launcher

on:
  workflow_dispatch:
  # main is built by release-main.yml, which calls this workflow
  workflow_call:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/pc-launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/pc-launcher.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Адрес архива игры и ключ закрытой раздачи — из секретов репозитория,
      # в исходниках их нет. Без секретов кнопка УСТАНОВИТЬ берёт game_url из launcher.ini.
      - name: Inject download secrets
        shell: pwsh
        working-directory: launcher/source
        env:
          BASTION_GAME_URL: ${{ secrets.BASTION_GAME_URL }}
          BASTION_GAME_MD5: ${{ secrets.BASTION_GAME_MD5 }}
          BASTION_DOWNLOAD_KEY: ${{ secrets.BASTION_DOWNLOAD_KEY }}
          BASTION_B2_KEY_ID: ${{ secrets.BASTION_B2_KEY_ID }}
          BASTION_B2_KEY: ${{ secrets.BASTION_B2_KEY }}
        run: |
          function Lit([string]$v) { '"' + ($v.Trim() -replace '\\', '\\' -replace '"', '\"') + '"' }
          $src = @"
          namespace BastionLauncher
          {
              static class Secrets
              {
                  public const string GameUrl = $(Lit $env:BASTION_GAME_URL);
                  public const string GameMd5 = $(Lit $env:BASTION_GAME_MD5);
                  public const string DownloadKey = $(Lit $env:BASTION_DOWNLOAD_KEY);
                  public const string B2KeyId = $(Lit $env:BASTION_B2_KEY_ID);
                  public const string B2Key = $(Lit $env:BASTION_B2_KEY);
              }
          }
          "@
          Set-Content -Path Secrets.cs -Value $src -Encoding utf8

      # Тот же компилятор .NET Framework 4, что и в build.bat у игрока
      - name: Compile BastionLauncher.exe
        shell: pwsh
        working-directory: launcher/source
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /platform:x86 /optimize+ `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll `
            /out:..\BastionLauncher.exe Core.cs Ui.cs Installer.cs Updater.cs Secrets.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package BastionLauncher folder
        shell: pwsh
        run: |
          $out = "dist\BastionLauncher"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item launcher\BastionLauncher.exe, launcher\launcher.ini, launcher\news.txt, launcher\README.txt $out
          Copy-Item -Recurse launcher\fonts, launcher\fps $out
          # исходники без файла с ключом
          New-Item -ItemType Directory -Force "$out\source" | Out-Null
          git show HEAD:launcher/source/Secrets.cs | Set-Content "$out\source\Secrets.cs" -Encoding utf8
          Get-ChildItem launcher\source -Exclude Secrets.cs | Copy-Item -Destination "$out\source"

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        with:
          name: BastionLauncher-PC
          path: dist/
          if-no-files-found: error
          retention-days: 30
