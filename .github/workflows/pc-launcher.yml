name: Build Bastion PC launcher

on:
  workflow_dispatch:
  # main is built by release-main.yml, which calls this workflow
  workflow_call:
  push:
    paths:
      - "launcher/**"
      - ".github/workflows/pc-launcher.yml"
  pull_request:
    paths:
      - "launcher/**"
      - ".github/workflows/pc-launcher.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Адрес архива игры и ключ закрытой раздачи — из секретов репозитория,
      # в исходниках их нет. Без секретов кнопка УСТАНОВИТЬ берёт game_url из launcher.ini.
      - name: Inject download secrets
        shell: pwsh
        working-directory: launcher/source
        env:
          # Архив игры для ПК отдельный от мобильного: BASTION_PC_GAME_URL / _MD5,
          # без них — общий BASTION_GAME_URL / _MD5
          BASTION_GAME_URL: ${{ secrets.BASTION_PC_GAME_URL || secrets.BASTION_GAME_URL }}
          BASTION_GAME_MD5: ${{ secrets.BASTION_PC_GAME_URL && secrets.BASTION_PC_GAME_MD5 || secrets.BASTION_GAME_MD5 }}
          BASTION_DOWNLOAD_KEY: ${{ secrets.BASTION_DOWNLOAD_KEY }}
          BASTION_B2_KEY_ID: ${{ secrets.BASTION_B2_KEY_ID }}
          BASTION_B2_KEY: ${{ secrets.BASTION_B2_KEY }}
          BASTION_GH_TOKEN: ${{ secrets.BASTION_GH_TOKEN }}
        run: |
          function Lit([string]$v) { '"' + ($v.Trim() -replace '\\', '\\' -replace '"', '\"') + '"' }
          $src = @"
          namespace BastionLauncher
          {
              static class Secrets
              {
                  public const string GameUrl = $(Lit $env:BASTION_GAME_URL);
                  public const string GameMd5 = $(Lit $env:BASTION_GAME_MD5);
                  public const string DownloadKey = $(Lit $env:BASTION_DOWNLOAD_KEY);
                  public const string B2KeyId = $(Lit $env:BASTION_B2_KEY_ID);
                  public const string B2Key = $(Lit $env:BASTION_B2_KEY);
                  public const string GitHubToken = $(Lit $env:BASTION_GH_TOKEN);
              }
          }
          "@
          Set-Content -Path Secrets.cs -Value $src -Encoding utf8

      # Тот же компилятор .NET Framework 4, что и в build.bat у игрока
      - name: Compile BastionLauncher.exe
        shell: pwsh
        working-directory: launcher/source
        run: |
          $csc = "$env:WINDIR\Microsoft.NET\Framework\v4.0.30319\csc.exe"
          & $csc /nologo /codepage:65001 /target:winexe /platform:x86 /optimize+ `
            /r:System.Windows.Forms.dll /r:System.Drawing.dll `
            /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Web.Extensions.dll `
            /out:..\BastionLauncher.exe Core.cs Ui.cs Installer.cs Updater.cs ClientPack.cs UiPack.cs Secrets.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Пакет FPS (до 165 FPS): загрузчик ASI, снятие лимита SA-MP и фиксы физики/разрешения.
      # Берём с официальных релизов авторов на GitHub (см. launcher/fps/README.txt).
      # Чего-то не нашлось — сборка не падает, в логе будет предупреждение.
      - name: Fetch FPS pack
        shell: pwsh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $fps = (Resolve-Path launcher\fps).Path
          $tmp = Join-Path $env:RUNNER_TEMP "fpspack"
          New-Item -ItemType Directory -Force $tmp | Out-Null
          function Fetch([string]$repo, [string]$pattern, [string[]]$take) {
            $rels = gh api "repos/$repo/releases?per_page=30" | ConvertFrom-Json
            $asset = $null
            foreach ($r in $rels) { foreach ($a in $r.assets) { if (-not $asset -and $a.name -match $pattern) { $asset = $a; $tag = $r.tag_name } } }
            if (-not $asset) {
              $names = ($rels | Select-Object -First 3 | ForEach-Object { $_.assets.name }) -join ", "
              Write-Host "::warning::$repo — нет файла по маске $pattern. Есть: $names"
              return
            }
            $d = Join-Path $tmp ($repo -replace '/', '_')
            New-Item -ItemType Directory -Force $d | Out-Null
            $f = Join-Path $d $asset.name
            Invoke-WebRequest $asset.browser_download_url -OutFile $f
            $src = Join-Path $d "x"
            New-Item -ItemType Directory -Force $src | Out-Null
            if ($f -match '\.(zip|7z|rar)$') { 7z x $f "-o$src" -y | Out-Null } else { Copy-Item $f $src }
            foreach ($t in $take) {
              $hit = Get-ChildItem $src -Recurse -File -Filter $t | Where-Object { $_.FullName -notmatch 'x64|win64|amd64' } | Select-Object -First 1
              if ($hit) { Copy-Item $hit.FullName $fps -Force; Write-Host "+ $($hit.Name)  ($repo $tag / $($asset.name))" }
              else { Write-Host "::warning::$repo $tag — в $($asset.name) нет $t. Внутри: $((Get-ChildItem $src -Recurse -File).Name -join ', ')" }
            }
          }
          try { Fetch "ThirteenAG/Ultimate-ASI-Loader" '^Ultimate-ASI-Loader\.zip$' @("dinput8.dll") } catch { Write-Host "::warning::$_" }
          try { Fetch "xKumorio/ModernFpsLimit" '\.(zip|7z|rar|asi)$' @("ModernFpsLimit.asi", "ModernFpsLimit.ini") } catch { Write-Host "::warning::$_" }
          try { Fetch "CookiePLMonster/SilentPatch" '^SilentPatchSA.*\.(zip|7z|rar)$' @("SilentPatchSA.asi", "SilentPatchSA.ini") } catch { Write-Host "::warning::$_" }
          try { Fetch "GTAmodding/FramerateVigilante" '\.(zip|7z|rar|asi)$' @("*SA*.asi") } catch { Write-Host "::warning::$_" }
          Get-ChildItem $fps | Format-Table Name, Length

      - name: Package BastionLauncher folder
        shell: pwsh
        run: |
          $out = "dist\BastionLauncher"
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item launcher\BastionLauncher.exe, launcher\launcher.ini, launcher\news.txt, launcher\README.txt $out
          Copy-Item -Recurse launcher\fonts, launcher\fps $out
          # исходники без файла с ключом
          New-Item -ItemType Directory -Force "$out\source" | Out-Null
          git show HEAD:launcher/source/Secrets.cs | Set-Content "$out\source\Secrets.cs" -Encoding utf8
          Get-ChildItem launcher\source -Exclude Secrets.cs | Copy-Item -Destination "$out\source"

      - name: Upload launcher
        uses: actions/upload-artifact@v4
        continue-on-error: true # квота артефактов не должна ронять сборку
        with:
          name: BastionLauncher-PC
          path: dist/
          if-no-files-found: error
          retention-days: 7

      # Ручной запуск: exe кладётся в релиз «builds» (не занимает место артефактов Actions)
      - name: Publish to builds release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist\BastionLauncher -DestinationPath BastionLauncher-PC.zip -Force
          gh release view builds *> $null
          if ($LASTEXITCODE -ne 0) { gh release create builds --prerelease --title "Свежие сборки" --notes "Последние ручные сборки лаунчеров." }
          gh release upload builds BastionLauncher-PC.zip --clobber
