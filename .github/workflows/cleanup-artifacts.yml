name: Clean up old artifacts

# Место под артефакты Actions ограничено (у приватного репо на бесплатном тарифе
# 500 МБ). Раз в сутки удаляем артефакты старше 3 дней и все, кроме последнего,
# с одинаковым именем. Запустить вручную: Actions → Clean up old artifacts → Run workflow.

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const all = await github.paginate(github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 });
            all.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
            const seen = new Set();
            const cutoff = Date.now() - 3 * 24 * 3600 * 1000;
            let freed = 0, count = 0;
            for (const a of all) {
              if (a.expired) continue;
              const keep = !seen.has(a.name) && new Date(a.created_at).getTime() > cutoff;
              seen.add(a.name);
              if (keep) continue;
              await github.rest.actions.deleteArtifact({ owner: context.repo.owner, repo: context.repo.repo, artifact_id: a.id });
              freed += a.size_in_bytes; count++;
            }
            core.notice(`Удалено артефактов: ${count}, освобождено ${(freed / 1048576).toFixed(0)} МБ`);
