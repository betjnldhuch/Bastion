name: Build single Bastion Android APK

# One installable APK: Bastion Launcher (online.bastion.launcher) with the
# SAMP-Mobile GTA-2.11 client embedded as an Android library module.

on:
  workflow_dispatch:
  # main is built by release-main.yml, which calls this workflow
  workflow_call:
  push:
    branches:
      - "integrate/**"
      - "feature/**"
    paths:
      - ".gitmodules"
      - "mobile/samp-mobile"
      - "mobile/samp-mobile-patches/**"
      - "mobile/launcher/**"
      - ".github/workflows/bastion-single-apk.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "mobile/samp-mobile"
      - "mobile/samp-mobile-patches/**"
      - "mobile/launcher/**"
      - ".github/workflows/bastion-single-apk.yml"

permissions:
  contents: write # ручной запуск выкладывает APK в релиз «builds»

concurrency:
  group: bastion-single-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  SAMP_MOBILE_COMMIT: 0a805d4c3d1adbc0baccd02125901f9987cb1ab1
  NDK_VERSION: 26.2.11394342
  BUILD_TOOLS: 35.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Bastion with pinned SAMP-Mobile source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify SAMP-Mobile pin
        working-directory: mobile/samp-mobile
        run: |
          test "$(git rev-parse HEAD)" = "$SAMP_MOBILE_COMMIT"
          test -f app/src/main/jniLibs/arm64-v8a/libGame.so
          # Upstream has no LICENSE file (README: "educational and research purposes only").
          ls LICENSE* 2>/dev/null || echo "::warning::SAMP-Mobile has no LICENSE file - check redistribution rights before publishing the APK"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-36" "build-tools;$BUILD_TOOLS" "ndk;$NDK_VERSION" "cmake;3.22.1" >/dev/null
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Patch SAMP-Mobile for embedding (library, storage, manifest)
        run: python3 -I mobile/samp-mobile-patches/apply.py mobile/samp-mobile

      - name: Build the one installable Bastion APK
        working-directory: mobile/launcher
        env:
          # Закрытая раздача game.zip (cloud/download-worker). Пусто = домашний сервер.
          BASTION_GAME_URL: ${{ secrets.BASTION_GAME_URL }}
          BASTION_GAME_MD5: ${{ secrets.BASTION_GAME_MD5 }}
          BASTION_DOWNLOAD_KEY: ${{ secrets.BASTION_DOWNLOAD_KEY }}
          # Закрытый бакет Backblaze B2 (BASTION_GAME_URL = b2://бакет/game.zip)
          BASTION_B2_KEY_ID: ${{ secrets.BASTION_B2_KEY_ID }}
          BASTION_B2_KEY: ${{ secrets.BASTION_B2_KEY }}
          # Приватный релиз GitHub (gh://владелец/репо/тег/файл), токен только на чтение
          BASTION_GH_TOKEN: ${{ secrets.BASTION_GH_TOKEN }}
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          mkdir -p ../artifacts
          cp "$APK" ../artifacts/Bastion-Launcher-SAMP-Mobile-debug.apk

      - name: Verify APK contents
        working-directory: mobile/artifacts
        run: |
          set -euo pipefail
          APK=Bastion-Launcher-SAMP-Mobile-debug.apk
          BT="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          AAPT2="$BT/aapt2"

          echo "== package"
          "$AAPT2" dump badging "$APK" | head -5
          "$AAPT2" dump badging "$APK" | grep -q "package: name='online.bastion.launcher'"
          LAUNCHERS=$("$AAPT2" dump badging "$APK" | grep -c "^launchable-activity" || true)
          test "$LAUNCHERS" = "1" || { echo "expected exactly one launcher activity, got $LAUNCHERS"; exit 1; }
          "$AAPT2" dump badging "$APK" | grep -q "launchable-activity: name='online.bastion.launcher.MainActivity'"

          echo "== merged manifest"
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          for a in com.gta.game.SAMP com.rockstargames.gtasa.GameActivity; do
            grep -q "$a" manifest.txt || { echo "missing activity $a"; exit 1; }
          done
          grep -q '":game"' manifest.txt || { echo "game process not declared"; exit 1; }
          if grep -q 'com.gta.launcher.activity.MainActivity' manifest.txt; then echo "upstream launcher leaked"; exit 1; fi
          if grep -q 'MANAGE_EXTERNAL_STORAGE\|REQUEST_INSTALL_PACKAGES' manifest.txt; then echo "unwanted permission"; exit 1; fi
          grep -q 'online.bastion.launcher.provider' manifest.txt || { echo "FileProvider authority not rebased"; exit 1; }

          echo "== native libraries (arm64-v8a only)"
          unzip -l "$APK" | grep -E 'lib/.*\.so$'
          if unzip -l "$APK" | grep -E 'lib/(armeabi-v7a|x86|x86_64)/'; then echo "unexpected ABI"; exit 1; fi
          rm -rf so && mkdir so && unzip -q -o "$APK" 'lib/arm64-v8a/*' -d so
          for lib in libGame.so libsamp.so libc++_shared.so libVendor_mpg123.so libopenal.so libbass.so libbass_ssl.so libshadowhook.so libGlossHook.so; do
            test -s "so/lib/arm64-v8a/$lib" || { echo "missing $lib"; exit 1; }
          done

          echo "== every DT_NEEDED of every packaged lib resolves (system or packaged)"
          SYSTEM="libc.so libm.so libdl.so liblog.so libandroid.so libEGL.so libGLESv2.so libGLESv3.so libOpenSLES.so libz.so libstdc++.so libmediandk.so libaaudio.so libvulkan.so libjnigraphics.so"
          for f in so/lib/arm64-v8a/*.so; do
            for need in $(readelf -d "$f" | sed -n 's/.*(NEEDED).*\[\(.*\)\]/\1/p'); do
              if [ -e "so/lib/arm64-v8a/$need" ] || echo " $SYSTEM " | grep -q " $need "; then continue; fi
              echo "$(basename $f) needs $need which is not packaged"; exit 1
            done
          done

          echo "== 16 KB page size: ELF LOAD alignment"
          for f in so/lib/arm64-v8a/*.so; do
            ALIGN=$(readelf -lW "$f" | awk '$1=="LOAD"{print $NF}' | sort -u | head -1)
            printf '%-28s %s\n' "$(basename $f)" "$ALIGN"
            case "$ALIGN" in 0x4000|0x10000) ;; *) echo "::error::$(basename $f) is not 16 KB aligned ($ALIGN)"; exit 1;; esac
          done
          echo "== 16 KB page size: zip alignment of uncompressed libs"
          "$BT/zipalign" -c -P 16 -v 4 "$APK" | grep -E 'lib/.*\.so' | head -20
          "$BT/zipalign" -c -P 16 4 "$APK"

          echo "== launcher wiring in dex"
          rm -rf dex && mkdir dex && unzip -q -o "$APK" 'classes*.dex' -d dex
          for marker in \
              'Lonline/bastion/launcher/ClientInstaller;' \
              'Lcom/gta/game/SAMP;' \
              'com.gta.game.SAMP' \
              'bastion.storage' \
              'BASTION_GTA_STORAGE' \
              'settings.ini' \
              'bastion.language' \
              'text/russian.gxt'; do
            grep -a -q -F "$marker" dex/*.dex || { echo "missing in dex: $marker"; exit 1; }
            echo "ok: $marker"
          done
          strings so/lib/arm64-v8a/libsamp.so | grep -q BASTION_GTA_STORAGE || { echo "native storage patch missing"; exit 1; }
          echo "== crash diagnostics: libsamp.so keeps its symbol table"
          readelf -S so/lib/arm64-v8a/libsamp.so | grep -q '\.symtab' || { echo "libsamp.so is stripped"; exit 1; }
          readelf -n so/lib/arm64-v8a/libsamp.so | grep -i "build id" || true
          echo "libGame.so exported symbols: $(readelf --dyn-syms -W so/lib/arm64-v8a/libGame.so | grep -c FUNC)"
          mkdir -p ../symbols
          cp so/lib/arm64-v8a/*.so ../symbols/
          UNSTRIPPED=$(find ../samp-mobile/app/build/intermediates/cxx -path '*obj/arm64-v8a/libsamp.so' | head -1)
          test -n "$UNSTRIPPED" && cp "$UNSTRIPPED" ../symbols/libsamp.so
          ls -la ../symbols
          rm -rf dex so manifest.txt
          ls -la "$APK"
          sha256sum "$APK"

      - name: Upload single Bastion APK
        uses: actions/upload-artifact@v4
        continue-on-error: true # квота артефактов не должна ронять сборку
        with:
          name: Bastion-Launcher-SAMP-Mobile-debug
          path: mobile/artifacts/Bastion-Launcher-SAMP-Mobile-debug.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload native libraries for crash symbolization
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: Bastion-native-symbols
          path: mobile/symbols/*.so
          if-no-files-found: error
          retention-days: 3

      # Ручной запуск: APK кладётся в релиз «builds» (не занимает место артефактов Actions)
      - name: Publish to builds release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view builds >/dev/null 2>&1 || \
            gh release create builds --prerelease --title "Свежие сборки" --notes "Последние ручные сборки лаунчеров."
          gh release upload builds mobile/artifacts/Bastion-Launcher-SAMP-Mobile-debug.apk --clobber
