name: Build single Bastion Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "integrate/**"
      - main
    paths:
      - "mobile/sampdroid"
      - "mobile/sampdroid/**"
      - "mobile/sampdroid-patches/**"
      - "mobile/launcher/**"
      - ".github/workflows/bastion-single-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "mobile/sampdroid"
      - "mobile/sampdroid/**"
      - "mobile/sampdroid-patches/**"
      - "mobile/launcher/**"
      - ".github/workflows/bastion-single-apk.yml"

permissions:
  contents: read

concurrency:
  group: bastion-single-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bastion with pinned SampDroid source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify upstream pin and license
        working-directory: mobile/sampdroid
        run: |
          test "$(git rev-parse HEAD)" = "f9daca1f4271dfd34c4aaeeaa4aaf21ae0e31d86"
          test -f LICENSE
          grep -q "MIT License" LICENSE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Brand and localize embedded client
        working-directory: mobile/sampdroid
        run: |
          sed -i 's/<string name="app_name">SampDroid<\//<string name="app_name">Bastion<\//' app/src/main/res/values/strings.xml
          python3 ../sampdroid-patches/apply.py .

      - name: SampDroid native regression tests (with Bastion patches)
        working-directory: mobile/sampdroid
        run: |
          set -euo pipefail
          SRCS=$(grep -o 'app/src/main/cpp/[a-z_]*\.cpp' .github/workflows/build-apk.yml | sort -u | tr '\n' ' ')
          c++ -std=c++17 -O1 -Wall -Wextra -pedantic -pthread -Iapp/src/main/cpp $SRCS \
            tests/native/raknet_codec_test.cpp -o /tmp/native-tests
          /tmp/native-tests

      - name: Convert SampDroid into an embedded Android library
        working-directory: mobile/sampdroid
        run: python3 ../sampdroid-patches/prepare_library.py

      - name: Build and test the one installable Bastion APK
        working-directory: mobile/launcher
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "package: name='online.bastion.launcher'"
          if "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "package: name='online.bastion.client'"; then
            echo "Unexpected second client package"
            exit 1
          fi
          mkdir -p ../artifacts
          cp "$APK" ../artifacts/Bastion-Launcher-Embedded-debug.apk

      - name: Verify embedded SampDroid and ZIP installer inside the APK
        working-directory: mobile/artifacts
        run: |
          set -euo pipefail
          APK=Bastion-Launcher-Embedded-debug.apk
          AAPT="$ANDROID_HOME/build-tools/34.0.0/aapt"
          echo "== native libraries"
          unzip -l "$APK" | grep -E 'lib/.*\.so$'
          for abi in armeabi-v7a arm64-v8a; do
            unzip -l "$APK" | grep -q "lib/$abi/libsampdroid.so" || { echo "libsampdroid.so missing for $abi"; exit 1; }
          done
          echo "== embedded client activity"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep -q 'com.xykal.sampdroid.ui.MainActivity' \
            || { echo "SampDroid activity is not in the merged manifest"; exit 1; }
          echo "== ZIP installer and launcher wiring"
          rm -rf dex && mkdir dex && unzip -q -o "$APK" 'classes*.dex' -d dex
          for marker in \
              'Lonline/bastion/launcher/ClientInstaller;' \
              'bastion_cache.zip' \
              'Data file Lite (samp)/ru.unisamp_mobile.game/files/' \
              'bastion.game_dir' \
              'adoptBastionGameData'; do
            grep -a -q -F "$marker" dex/*.dex || { echo "missing in dex: $marker"; exit 1; }
            echo "ok: $marker"
          done
          rm -rf dex
          ls -la "$APK"

      - name: Upload single Bastion APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Launcher-Embedded-debug
          path: mobile/artifacts/Bastion-Launcher-Embedded-debug.apk
          if-no-files-found: error
          retention-days: 14
