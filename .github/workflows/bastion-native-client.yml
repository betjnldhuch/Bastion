name: Build single Bastion Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - "integrate/**"
      - main
    paths:
      - "mobile/sampdroid"
      - "mobile/sampdroid/**"
      - "mobile/sampdroid-patches/**"
      - "mobile/launcher/**"
      - ".github/workflows/bastion-native-client.yml"

permissions:
  contents: read

concurrency:
  group: bastion-single-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bastion with pinned SampDroid source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify upstream pin and license
        working-directory: mobile/sampdroid
        run: |
          test "$(git rev-parse HEAD)" = "f9daca1f4271dfd34c4aaeeaa4aaf21ae0e31d86"
          test -f LICENSE
          grep -q "MIT License" LICENSE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Brand and localize embedded client
        working-directory: mobile/sampdroid
        run: |
          sed -i 's/<string name="app_name">SampDroid<\//<string name="app_name">Bastion<\//' app/src/main/res/values/strings.xml
          python3 ../sampdroid-patches/apply.py .

      - name: Convert SampDroid into an embedded Android library
        working-directory: mobile/sampdroid
        run: python3 ../sampdroid-patches/prepare_library.py

      - name: Build and test the one installable Bastion APK
        working-directory: mobile/launcher
        run: |
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "package: name='online.bastion.launcher'"
          if "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep -q "package: name='online.bastion.client'"; then
            echo "Unexpected second client package"
            exit 1
          fi
          mkdir -p ../artifacts
          cp "$APK" ../artifacts/Bastion-Launcher-Embedded-debug.apk

      - name: Upload single Bastion APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-Launcher-Embedded-debug
          path: mobile/artifacts/Bastion-Launcher-Embedded-debug.apk
          if-no-files-found: error
          retention-days: 14
