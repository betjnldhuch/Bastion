name: Build Bastion native SA-MP client

on:
  workflow_dispatch:
  push:
    branches:
      - "integrate/**"
      - main
    paths:
      - "mobile/sampdroid"
      - "mobile/sampdroid/**"
      - ".github/workflows/bastion-native-client.yml"

permissions:
  contents: read

concurrency:
  group: bastion-native-client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Bastion with pinned SampDroid source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify upstream pin and license
        working-directory: mobile/sampdroid
        run: |
          test "$(git rev-parse HEAD)" = "f9daca1f4271dfd34c4aaeeaa4aaf21ae0e31d86"
          test -f LICENSE
          grep -q "MIT License" LICENSE

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK, NDK and CMake
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> "$GITHUB_ENV"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Brand native client for Bastion
        working-directory: mobile/sampdroid
        run: |
          sed -i 's/applicationId = "com.xykal.sampdroid"/applicationId = "online.bastion.client"/' app/build.gradle.kts
          sed -i 's/<string name="app_name">SampDroid<\//<string name="app_name">Bastion Online<\//' app/src/main/res/values/strings.xml
          sed -i 's/title = "SampDroid"/title = "Bastion Online"/' app/src/main/java/com/xykal/sampdroid/ui/MainActivity.kt
          grep -q 'applicationId = "online.bastion.client"' app/build.gradle.kts
          grep -q 'Bastion Online' app/src/main/res/values/strings.xml

      - name: Run unit tests and build ARM32 + ARM64 APK
        working-directory: mobile/sampdroid
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Bastion native client APK
        uses: actions/upload-artifact@v4
        with:
          name: Bastion-native-client-debug
          path: mobile/sampdroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
